services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: truehire
      POSTGRES_PASSWORD: truehire_dev
      POSTGRES_DB: truehire
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  pgdata:
